[package]
name = "zorite-editor"
version = "0.11.8"
edition = "2024"
description = "A multi-line text editor for GPUI with live Markdown preview, tables, images, and math. The editor behind Zorite's notes."
license = "MIT"
repository = "https://github.com/packetThrower/zorite-editor"
homepage = "https://packetthrower.github.io/zorite/reference/crates/zorite-editor/"
keywords = ["gpui", "editor", "markdown", "wysiwyg", "text-editor"]
categories = ["gui", "text-editors"]

[dependencies]
# gpui ships on crates.io as the `gpui-pre` family; a caret spec so users aren't pinned to one snapshot.
gpui = { package = "gpui-pre", version = "0.3.12" }

# Grapheme-cluster boundaries for cursor movement, so an emoji / combining mark
# moves as a single unit (matches gpui's own input example).
unicode-segmentation = "1"

# Shared markdown-construct recognition (`zorite_markdown::syntax`): alert kinds,
# table styles, heading scales — so WYSIWYG and the reader can never drift
# apart on what a construct IS. Rendering stays entirely this crate's own.
zorite-markdown = { version = "0.10.1", default-features = false }

# Bidi index↔x mapping (#66). gpui's own `x_for_index` / `index_for_x` assume
# byte index and x rise together, which is false for a right-to-left line — so
# every caret/click lookup in this crate goes through `VisualMap` on RTL rows.
gpui-bidi = "0.1"

# The standalone demo needs a platform backend to open a real window (the `gpui`
# crate alone has no app entry point in this setup — it's split into
# `gpui_platform`, same as the host app).
[dev-dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "0.3", features = ["font-kit", "wayland", "x11", "runtime_shaders"] }
# `#[gpui::test]` + a headless window, for the IME input-handler tests.
gpui = { package = "gpui-pre", version = "0.3.12", features = ["test-support"] }

# The demo wires the editor to the real OS spell checker (M6). Dev-only, so the
# editor crate itself stays host-agnostic and free of any OS-FFI dependency.
os-spellcheck = "0.2"

# A runnable, standalone demo window: `cargo run -p zorite-editor --example demo`.
[[example]]
name = "demo"
